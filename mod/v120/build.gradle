// Minecraft 1.20 – 1.21.11 (ofuscado): se compila con los nombres de Mojang y se reasigna a intermediary
plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
version = project.mod_version
group = 'net.luckicla'
base { archivesName = 'compass-comandos-1.20' }
sourceSets.main.java.srcDirs = ['../src/main/java']
sourceSets.main.resources.srcDirs = ['../src/main/resources']
dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings loom.officialMojangMappings()
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
  def p = [version: project.version, mcrange: '>=1.20 <1.22']
  inputs.properties p
  filesMatching('fabric.mod.json') { expand p }
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { it.options.release = 17; it.options.encoding = 'UTF-8' }
