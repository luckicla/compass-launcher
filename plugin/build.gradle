// Plugin de Compass para servidores Paper (y Arclight): los mismos comandos que el mod de Fabric, con autocompletado.
plugins { id 'java' }
group = 'net.luckicla'
version = project.findProperty('mod_version') ?: '1.0'
repositories {
  mavenCentral()
  maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies { compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
processResources { def p = [version: project.version]; inputs.properties p; filesMatching('plugin.yml') { expand p } }
jar { archiveFileName = 'compass-plugin.jar' }
